<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Plus Repairs – Invoice / Quote Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; color: #222; }

  /* ── BUILDER PANEL ── */
  #builder {
    max-width: 860px;
    margin: 30px auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.12);
    padding: 30px;
  }
  #builder h1 { font-size: 1.4rem; margin-bottom: 22px; color: #1a4fa0; }
  .section-title {
    font-size: .85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #1a4fa0;
    border-bottom: 2px solid #1a4fa0;
    padding-bottom: 4px;
    margin: 22px 0 14px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 4px; color: #444; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px;
    font-size: .88rem; font-family: inherit;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #1a4fa0; }

  /* items table */
  #items-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  #items-table th {
    background: #1a4fa0; color: #fff; font-size: .78rem;
    padding: 8px 10px; text-align: left;
  }
  #items-table td { padding: 6px 6px; vertical-align: top; border-bottom: 1px solid #eee; }
  #items-table input, #items-table textarea {
    border: 1px solid #ddd; border-radius: 4px; background: #fafafa;
    padding: 5px 7px; font-size: .82rem;
  }
  #items-table textarea { min-height: 60px; }
  .col-qty    { width: 60px; }
  .col-price  { width: 100px; }
  .col-disc   { width: 90px; }
  .col-total  { width: 100px; font-weight: 600; font-size: .85rem; padding-top: 12px !important; }
  .col-del    { width: 36px; text-align: center; }
  .disc-input { border-color: #e67e22 !important; }
  .disc-label { font-size:.7rem; color:#e67e22; display:block; margin-bottom:2px; font-weight:600; }
  .btn-del {
    background: #e74c3c; color: #fff; border: none; border-radius: 50%;
    width: 26px; height: 26px; cursor: pointer; font-size: 1rem; line-height: 26px;
  }
  .btn-add {
    margin-top: 10px; padding: 8px 18px; background: #27ae60; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: .85rem; font-weight: 600;
  }
  .btn-add:hover { background: #219150; }

  /* action buttons */
  .actions { display: flex; gap: 14px; margin-top: 28px; flex-wrap: wrap; }
  .btn-preview {
    padding: 11px 28px; background: #1a4fa0; color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: .95rem; font-weight: 700;
  }
  .btn-preview:hover { background: #153c80; }
  .btn-reset {
    padding: 11px 22px; background: #aaa; color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: .95rem;
  }

  /* ── PREVIEW / PRINT ── */
  #preview-wrap { display: none; }
  .print-actions {
    max-width: 860px; margin: 20px auto; display: flex; gap: 14px;
  }
  .btn-print {
    padding: 11px 28px; background: #27ae60; color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: .95rem; font-weight: 700;
  }
  .btn-back {
    padding: 11px 22px; background: #1a4fa0; color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: .95rem;
  }
  .btn-save {
    padding: 11px 24px; background: #8e44ad; color: #fff;
    border: none; border-radius: 7px; cursor: pointer; font-size: .95rem; font-weight: 700;
  }
  .btn-save:hover { background: #6c3483; }

  /* ── INVOICE DOCUMENT ── */
  #invoice-doc {
    max-width: 860px;
    margin: 0 auto 40px;
    background: #fff;
    border: 1px solid #ccc;
    padding: 36px 40px;
    font-size: .88rem;
    line-height: 1.5;
  }

  .inv-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; }
  .inv-brand { color: #1a4fa0; font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
  .inv-address { font-size: .82rem; line-height: 1.7; color: #444; }
  .inv-meta { text-align: right; font-size: .85rem; }
  .inv-meta table { border-collapse: collapse; margin-left: auto; }
  .inv-meta td { padding: 2px 6px; }
  .inv-meta td:first-child { font-weight: 700; color: #1a4fa0; }
  .inv-type-badge {
    display: inline-block;
    background: #1a4fa0; color: #fff;
    font-size: 1.05rem; font-weight: 900;
    padding: 5px 18px; border-radius: 4px;
    margin-bottom: 10px; letter-spacing: .04em;
  }

  .inv-divider { border: none; border-top: 2px solid #1a4fa0; margin: 14px 0; }

  .items-tbl { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .items-tbl thead tr { background: #1a4fa0; color: #fff; }
  .items-tbl th { padding: 9px 10px; text-align: left; font-size: .82rem; }
  .items-tbl td { padding: 9px 10px; border-bottom: 1px solid #e8e8e8; font-size: .83rem; vertical-align: top; }
  .items-tbl tbody tr:nth-child(even) { background: #f7f9ff; }
  .items-tbl .td-price, .items-tbl .td-total { text-align: right; white-space: nowrap; }
  .items-tbl .td-qty { text-align: center; }

  .total-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .total-box {
    background: #1a4fa0; color: #fff;
    padding: 10px 22px; border-radius: 6px; font-size: 1rem; font-weight: 700;
  }

  .inv-note {
    margin-top: 22px; background: #f7f9ff; border-left: 4px solid #1a4fa0;
    padding: 12px 16px; border-radius: 0 6px 6px 0; font-size: .82rem;
  }
  .inv-note strong { display: block; margin-bottom: 4px; color: #1a4fa0; }

  .inv-banking {
    margin-top: 18px; font-size: .82rem;
  }
  .inv-banking strong { color: #1a4fa0; display: block; margin-bottom: 6px; font-size: .88rem; }
  .bank-grid { display: grid; grid-template-columns: 140px 1fr; gap: 2px 10px; }
  .bank-label { font-weight: 700; color: #444; }

  .inv-footer { margin-top: 18px; font-size: .75rem; color: #888; text-align: center; border-top: 1px solid #ddd; padding-top: 10px; }

  /* print */
  @media print {
    @page { margin: 15mm 12mm; size: A4; }
    body { background: #fff; }
    #builder, .print-actions { display: none !important; }
    #preview-wrap { display: block !important; }
    #invoice-doc { border: none; padding: 0; max-width: 100%; }
    .inv-type-badge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .items-tbl thead tr { -webkit-print-color-adjust: exact; print-color-adjust: exact; background: #1a4fa0 !important; }
    .total-box { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .inv-note { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* keep header together, never break inside a row */
    .inv-header { page-break-inside: avoid; break-inside: avoid; }
    .items-tbl tr { page-break-inside: avoid; break-inside: avoid; }
    /* keep totals + notes + banking together on same page if possible */
    .total-row, .inv-note, .inv-banking, .inv-footer {
      page-break-inside: avoid; break-inside: avoid;
    }
    /* repeat table header on each page */
    .items-tbl thead { display: table-header-group; }
    /* push banking + footer to bottom if page breaks */
    .inv-banking { page-break-before: auto; }
    .inv-footer { page-break-before: auto; margin-top: 10mm; }
  }
</style>
</head>
<body>

<!-- ════════════════ BUILDER ════════════════ -->
<div id="builder">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px"><img id="builder-logo" src="" alt="Cell Plus Repairs" style="height:64px"><div><h1 style="margin-bottom:0">Invoice / Quote Generator</h1></div></div>

  <div class="section-title">Document Type & Number</div>
  <div style="display:grid;grid-template-columns:1fr 0.6fr 1fr 1fr 1fr;gap:12px">
    <div>
      <label>Document Type</label>
      <select id="docType">
        <option value="INVOICE">Invoice</option>
        <option value="QUOTE">Quote</option>
      </select>
    </div>
    <div>
      <label># of the day</label>
      <input type="number" id="docSeq" value="1" min="1" max="99" oninput="setDocNumber()" style="width:100%">
    </div>
    <div>
      <label>Document Number <span style="font-weight:400;color:#888;font-size:.75rem">(auto)</span></label>
      <input type="text" id="docNumber" readonly style="background:#f4f6fb;color:#555;cursor:default">
    </div>
    <div id="paymentStatusWrap">
      <label>Payment Status</label>
      <select id="paymentStatus">
        <option value="owing">Amount Owing</option>
        <option value="paid">Amount Paid</option>
      </select>
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="docDate">
    </div>
  </div>

  <div class="section-title">Customer Details</div>
  <div class="grid2">
    <div>
      <label>Customer Name</label>
      <input type="text" id="custName" placeholder="Full name">
    </div>
    <div>
      <label>Contact Number / Email</label>
      <input type="text" id="custContact" placeholder="076 xxx xxxx or email">
    </div>
    <div>
      <label>Order Number <span style="font-weight:400;color:#888">(optional)</span></label>
      <input type="text" id="orderNumber" placeholder="e.g. 180502">
    </div>
  </div>

  <div class="section-title">Line Items</div>
  <table id="items-table">
    <thead>
      <tr>
        <th>Item / Title</th>
        <th>Description</th>
        <th class="col-qty">Qty</th>
        <th class="col-price">Unit Price (R)</th>
        <th class="col-disc">Discount (R)</th>
        <th class="col-total">Total</th>
        <th class="col-del"></th>
      </tr>
    </thead>
    <tbody id="items-body"></tbody>
  </table>
  <button class="btn-add" onclick="addItem()">+ Add Item</button>

  <div class="section-title">Note <span style="font-weight:400;font-size:.8rem;color:#888">(optional — printed below the total)</span></div>
  <textarea id="noteText" rows="4" placeholder="E.g. Screen protector waived as courtesy discount..."></textarea>

  <div class="section-title">Terms &amp; Conditions <span style="font-weight:400;font-size:.8rem;color:#888">(pre-filled, edit if needed)</span></div>
  <textarea id="termsText" rows="5"></textarea>

  <div class="actions">
    <button class="btn-preview" onclick="generateInvoice()">Preview &amp; Print</button>
    <button class="btn-reset" onclick="resetForm()">Reset Form</button>
  </div>
</div>

<!-- ════════════════ PREVIEW ════════════════ -->
<div id="preview-wrap">
  <div class="print-actions">
    <button class="btn-back" onclick="goBack()">← Back to Editor</button>
    <button class="btn-save" onclick="saveInvoice()">Save as HTML</button>
    <button class="btn-print" onclick="savePDF()">Save as PDF</button>
  </div>
  <div id="invoice-doc"></div>
</div>

Discounts offered are non-transferable and valid only for the specified invoice.`;

// ── number generation ──
function buildDocNumber(type, seq) {
  const prefix = type === 'INVOICE' ? 'INV' : 'QUO';
  const d = new Date();
  const y = String(d.getFullYear()).slice(2);
  const m = String(d.getMonth()+1).padStart(2,'0');
  const n = String(parseInt(seq) || 1).padStart(2,'0');
  return prefix + y + m + n;
}

// ── init ──
window.onload = () => {
  document.getElementById('docDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('builder-logo').src = LOGO_B64;
  document.getElementById('termsText').value = DEFAULT_TERMS;
  setDocNumber();
  addItem();
};

function setDocNumber() {
  const t   = document.getElementById('docType').value;
  const seq = document.getElementById('docSeq').value;
  document.getElementById('docNumber').value = buildDocNumber(t, seq);
  document.getElementById('paymentStatusWrap').style.display = t === 'INVOICE' ? '' : 'none';
}

// ── items ──
let itemCount = 0;
function addItem() {
  itemCount++;
  const id = itemCount;
  const tbody = document.getElementById('items-body');
  const tr = document.createElement('tr');
  tr.id = 'item-row-' + id;
  tr.innerHTML = `
    <td><input type="text" id="item-title-${id}" placeholder="Item name"></td>
    <td><textarea id="item-desc-${id}" placeholder="Description of work or product"></textarea></td>
    <td class="col-qty"><input type="number" id="item-qty-${id}" value="1" min="1" oninput="calcRow(${id})"></td>
    <td class="col-price"><input type="number" id="item-price-${id}" value="" placeholder="0.00" step="0.01" oninput="calcRow(${id})"></td>
    <td class="col-disc"><input type="number" id="item-disc-${id}" value="" placeholder="0.00" step="0.01" min="0" class="disc-input" oninput="calcRow(${id})"></td>
    <td class="col-total" id="item-total-${id}">R 0.00</td>
    <td class="col-del"><button class="btn-del" onclick="removeItem(${id})">×</button></td>
  `;
  tbody.appendChild(tr);
}
function removeItem(id) {
  const row = document.getElementById('item-row-' + id);
  if (row) row.remove();
}
function calcRow(id) {
  const qty   = parseFloat(document.getElementById('item-qty-'  + id).value) || 0;
  const price = parseFloat(document.getElementById('item-price-'+ id).value) || 0;
  const disc  = parseFloat(document.getElementById('item-disc-' + id).value) || 0;
  const subtotal = qty * price;
  const total    = Math.max(0, subtotal - disc);
  const cell = document.getElementById('item-total-' + id);
  if (disc > 0) {
    cell.innerHTML = `<span style="text-decoration:line-through;color:#aaa;font-weight:400;font-size:.8rem">R ${subtotal.toLocaleString('en-ZA',{minimumFractionDigits:2})}</span><br>`
      + `<span style="color:#e74c3c;font-size:.8rem">- R ${disc.toLocaleString('en-ZA',{minimumFractionDigits:2})}</span><br>`
      + `<strong>R ${total.toLocaleString('en-ZA',{minimumFractionDigits:2})}</strong>`;
  } else {
    cell.textContent = 'R ' + total.toLocaleString('en-ZA', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  return total;
}

// ── collect items ──
function collectItems() {
  const rows = document.querySelectorAll('#items-body tr');
  const items = [];
  rows.forEach(tr => {
    const id    = tr.id.replace('item-row-','');
    const title = document.getElementById('item-title-' +id)?.value.trim();
    const desc  = document.getElementById('item-desc-'  +id)?.value.trim();
    const qty   = parseFloat(document.getElementById('item-qty-'  +id)?.value) || 0;
    const price = parseFloat(document.getElementById('item-price-'+id)?.value) || 0;
    const disc  = parseFloat(document.getElementById('item-disc-' +id)?.value) || 0;
    const subtotal = qty * price;
    const total    = Math.max(0, subtotal - disc);
    if (title || desc) items.push({ title, desc, qty, price, disc, subtotal, total });
  });
  return items;
}

function fmt(n) { return 'R ' + n.toLocaleString('en-ZA', {minimumFractionDigits:2, maximumFractionDigits:2}); }

// ── generate ──
function generateInvoice() {
  const type    = document.getElementById('docType').value;
  const number  = document.getElementById('docNumber').value.trim() || '—';
  const date    = document.getElementById('docDate').value;
  const custName= document.getElementById('custName').value.trim() || '—';
  const custContact = document.getElementById('custContact').value.trim() || '—';
  const orderNum= document.getElementById('orderNumber').value.trim();
  const paymentStatus = document.getElementById('paymentStatus').value;
  const note    = document.getElementById('noteText').value.trim();
  const terms   = document.getElementById('termsText').value.trim();
  const items   = collectItems();

  if (!items.length) { alert('Please add at least one item.'); return; }
  _lastSaveData = { number, custName, orderNum };

  const grandTotal = items.reduce((s, i) => s + i.total, 0);
  const fmtDate = date ? date.replace(/-/g,'/') : '—';

  // meta rows
  let metaRows = `
    <tr><td>${type === 'INVOICE' ? 'Invoice Number:' : 'Quote Number:'}</td><td>${esc(number)}</td></tr>
    <tr><td>Date:</td><td>${fmtDate}</td></tr>
    <tr><td>Customer Name:</td><td>${esc(custName)}</td></tr>
    <tr><td>Contact Number / Email:</td><td>${esc(custContact)}</td></tr>
  `;
  if (orderNum) metaRows += `<tr><td>Order Number:</td><td>${esc(orderNum)}</td></tr>`;

  // items rows
  const itemsRows = items.map(i => `
    <tr>
      <td><strong>${esc(i.title)}</strong></td>
      <td>${esc(i.desc).replace(/\n/g,'<br>')}</td>
      <td class="td-qty">${i.qty}</td>
      <td class="td-price">${fmt(i.price)}</td>
      <td class="td-total">${i.disc > 0
        ? `<span style="text-decoration:line-through;color:#aaa;font-size:.8rem">${fmt(i.subtotal)}</span><br>`
          + `<span style="color:#e74c3c;font-size:.8rem">- ${fmt(i.disc)}</span><br>`
          + `<strong>${fmt(i.total)}</strong>`
        : fmt(i.total)}</td>
    </tr>
  `).join('');

  // note block
  const noteHtml = note ? `
    <div class="inv-note">
      <strong>NOTE:</strong>
      ${esc(note).replace(/\n/g,'<br>')}
    </div>` : '';

  // terms block
  const termsHtml = terms ? `
    <div class="inv-note" style="margin-top:10px">
      <strong>Terms &amp; Conditions:</strong>
      ${esc(terms).replace(/\n/g,'<br>')}
    </div>` : '';

  // banking (only for invoices)
  const bankHtml = type === 'INVOICE' && paymentStatus !== 'paid' ? `
    <div class="inv-banking">
      <strong>Banking Details for Payment</strong>
      <div class="bank-grid">
        <span class="bank-label">Bank Name:</span><span>${BANKING.bank}</span>
        <span class="bank-label">Account Name:</span><span>${BANKING.account}</span>
        <span class="bank-label">Account Number:</span><span>${BANKING.number}</span>
        <span class="bank-label">Branch Code:</span><span>${BANKING.branch}</span>
        <span class="bank-label">Account Type:</span><span>${BANKING.type}</span>
        <span class="bank-label">Reference:</span><span>${BANKING.ref}</span>
      </div>
    </div>` : '';

  const html = `
    <div class="inv-header">
      <div>
        <img src="${LOGO_B64}" alt="Cell Plus Repairs" style="height:70px;margin-bottom:6px;display:block">
        <div class="inv-address">
          ${COMPANY.address.map(esc).join('<br>')}
          <br>${COMPANY.phone}
          <br>${COMPANY.email}
        </div>
      </div>
      <div class="inv-meta">
        <div class="inv-type-badge">${type}</div>
        <table><tbody>${metaRows}</tbody></table>
      </div>
    </div>
    <hr class="inv-divider">
    <table class="items-tbl">
      <thead>
        <tr>
          <th style="width:18%">Item Description</th>
          <th>Specification</th>
          <th style="width:6%">Qty</th>
          <th style="width:14%;text-align:right">Unit Price (ZAR)</th>
          <th style="width:13%;text-align:right">Total (ZAR)</th>
        </tr>
      </thead>
      <tbody>${itemsRows}</tbody>
    </table>
    <div class="total-row">
      <div class="total-box" style="background:${type==='QUOTE'?'#1a4fa0':paymentStatus==='paid'?'#27ae60':'#1a4fa0'}">
        ${type==='QUOTE'?'Total':paymentStatus==='paid'?'Total Amount Paid':'Total Amount Owing'} &nbsp; ${fmt(grandTotal)}
      </div>
    </div>
    ${noteHtml}
    ${termsHtml}
    ${bankHtml}
    <div class="inv-footer">${COMPANY.name} &nbsp;·&nbsp; ${COMPANY.address[2]} &nbsp;·&nbsp; ${COMPANY.phone}</div>
  `;

  document.getElementById('invoice-doc').innerHTML = html;
  document.getElementById('builder').style.display = 'none';
  document.getElementById('preview-wrap').style.display = 'block';
  window.scrollTo(0,0);
}

// ── save as HTML file ──

.items-tbl tbody tr:nth-child(even){background:#f7f9ff}
.td-price,.td-total{text-align:right;white-space:nowrap}

  const blob = new Blob([fullHtml], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function goBack() {
  document.getElementById('builder').style.display = 'block';
  document.getElementById('preview-wrap').style.display = 'none';
  // refresh number field to show next available number
  setDocNumber();
}

function resetForm() {
  if (!confirm('Reset all fields?')) return;
  document.getElementById('custName').value = '';
  document.getElementById('custContact').value = '';
  document.getElementById('orderNumber').value = '';
  document.getElementById('noteText').value = '';
  document.getElementById('termsText').value = DEFAULT_TERMS;
  document.getElementById('items-body').innerHTML = '';
  itemCount = 0;
  setDocNumber();
  document.getElementById('docDate').value = new Date().toISOString().slice(0,10);
  addItem();
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

  .inv-banking { margin-top: 18px; font-size: .82rem; page-break-inside: avoid; break-inside: avoid; }
  .inv-banking strong { color: #1a4fa0; display: block; margin-bottom: 6px; font-size: .88rem; }
  .bank-grid { display: grid; grid-template-columns: 140px 1fr; gap: 2px 10px; }
  .bank-label { font-weight: 700; color: #444; }
  .inv-footer { margin-top: 18px; font-size: .75rem; color: #888; text-align: center; border-top: 1px solid #ddd; padding-top: 10px; page-break-inside: avoid; }
</style>
</head><body>${docHtml}</body></html>`);
  win.document.close();
  win.onload = () => { win.focus(); win.print(); };
}

// attach docType change after DOM ready
document.getElementById('docType').addEventListener('change', setDocNumber);
</script>
